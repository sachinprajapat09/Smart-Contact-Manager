<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Password Changed Successfully - Smart Contact Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <!-- MAIN CARD CONTAINER -->
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-100 shadow-2xl p-8 text-center space-y-6 relative overflow-hidden">
        
        <!-- Background Decorative Glow -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-emerald-100 rounded-full blur-2xl opacity-60"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-indigo-100 rounded-full blur-2xl opacity-60"></div>

        <!-- Animated/Styled Success Icon -->
        <div class="relative mx-auto w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center border border-emerald-100 shadow-inner">
            <div class="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-emerald-200">
                <i class="fa-solid fa-check"></i>
            </div>
        </div>

        <!-- Heading & Details -->
        <div class="space-y-2">
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Password Changed!</h2>
            <p class="text-xs text-slate-500 leading-relaxed">
                Your password has been updated successfully. You can now use your new password to log in securely.
            </p>
        </div>

        <!-- Info Card -->
        <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl flex items-center gap-3 text-left">
            <div class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center flex-shrink-0 text-sm border border-amber-100">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <p class="text-[11px] text-slate-600 font-medium leading-tight">
                If you did not request this change, please contact our support team immediately.
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-2.5 pt-2">
            <!-- Go to Dashboard -->
            <a th:href="@{/user/index}" class="block w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-200 hover:-translate-y-0.5 transition duration-150">
                <i class="fa-solid fa-house mr-1.5"></i> Back to Dashboard
            </a>
            
            <!-- Re-login (Optional) -->
            <a th:href="@{/logout}" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">
                <i class="fa-solid fa-right-from-bracket mr-1.5"></i> Re-login with New Password
            </a>
        </div>

        <!-- Auto Redirect Notice -->
        <p class="text-[10px] text-slate-400">
            Redirecting to dashboard in <span id="countdown" class="font-bold text-indigo-600">5</span> seconds...
        </p>

    </div>

    <!-- Auto Redirect Script (5 Seconds Countdown) -->
    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = '/user/index'; // Redirect path
            }
        }, 1000);
    </script>
</body>
</html>
