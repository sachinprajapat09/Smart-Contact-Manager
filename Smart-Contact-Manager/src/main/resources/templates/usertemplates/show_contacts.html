<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .contact-avatar {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #0d6efd;
        }
        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 1000;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 300px;
            overflow-y: auto;
            border-radius: 0 0 8px 8px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fa-solid fa-address-book me-2"></i>Contact List</h4>
            <a href="add_contact.html" class="btn btn-light btn-sm"><i class="fa-solid fa-plus me-1"></i>Add Contact</a>
        </div>
        
        <div class="card-body">
            <!-- Toast / Alert Message -->
            <div id="sessionToast" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                <span id="toastMessage">Action completed successfully!</span>
                <button type="button" class="btn-close" onclick="dismissSessionToast()"></button>
            </div>

            <!-- Search Bar -->
            <div class="position-relative mb-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search contacts by name or phone..." onkeyup="searchContacts()">
                    <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()">Clear</button>
                </div>
                <!-- Dynamic Search Dropdown -->
                <div id="searchResults" class="search-results-dropdown list-group d-none"></div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Profile</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <!-- Default Data (Example Row) -->
                        <tr id="contact-row-1">
                            <td>
                                <!-- Photo Na hone par Avatar generator -->
                                <img src="https://ui-avatars.com/api/?name=Rahul+Sharma&background=random&color=fff&bold=true" class="contact-avatar" alt="Rahul Sharma">
                            </td>
                            <td>Rahul Sharma</td>
                            <td>+91 9876543210</td>
                            <td>rahul@example.com</td>
                            <td class="text-center">
                                <a href="edit_contact.html?id=1" class="btn btn-sm btn-outline-primary me-1"><i class="fa-solid fa-pen"></i></a>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteContactConfirm(1)"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Custom Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" onclick="closeDeleteModal()"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this contact?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let deleteModalInstance = null;
    let contactToDeleteId = null;

    document.addEventListener("DOMContentLoaded", () => {
        deleteModalInstance = new bootstrap.Modal(document.getElementById('deleteModal'));
    });

    // Main Function: Search & Render logic
    async function searchContacts() {
        const query = document.getElementById('searchInput').value.trim();
        const resultsContainer = document.getElementById('searchResults');

        if (query.length === 0) {
            clearSearch();
            return;
        }

        try {
            // AAPKA BACKEND API ENDPOINT HERE
            const response = await fetch(`search_api.php?q=${encodeURIComponent(query)}`);
            const contacts = await response.json();

            resultsContainer.innerHTML = '';
            
            if (contacts.length === 0) {
                resultsContainer.innerHTML = '<div class="list-group-item text-muted">No contacts found</div>';
            } else {
                contacts.forEach(contact => {
                    // LOGIC: Agar Photo nahi hai toh Name ke first letter ka Initial Avatar generate karein
                    const avatarUrl = (contact.photo && contact.photo.trim() !== '') 
                        ? contact.photo 
                        : `https://ui-avatars.com/api/?name=${encodeURIComponent(contact.name || 'User')}&background=random&color=fff&bold=true`;

                    const item = document.createElement('a');
                    item.href = `#contact-row-${contact.id}`;
                    item.className = 'list-group-item list-group-item-action d-flex align-items-center gap-3';
                    item.innerHTML = `
                        <img src="${avatarUrl}" class="contact-avatar" style="width:35px; height:35px;" alt="${contact.name}">
                        <div>
                            <strong class="d-block">${contact.name}</strong>
                            <small class="text-muted">${contact.phone}</small>
                        </div>
                    `;
                    item.onclick = () => {
                        resultsContainer.classList.add('d-none');
                    };
                    resultsContainer.appendChild(item);
                });
            }
            resultsContainer.classList.remove('d-none');
        } catch (error) {
            console.error("Search Error:", error);
        }
    }

    // Clear Search Input
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '';
        resultsContainer.classList.add('d-none');
    }

    // Open Delete Modal
    function deleteContactConfirm(cid) {
        contactToDeleteId = cid;
        const confirmBtn = document.getElementById('confirmDeleteBtn');
        confirmBtn.onclick = () => executeDelete(cid);
        deleteModalInstance.show();
    }

    // Close Delete Modal
    function closeDeleteModal() {
        if (deleteModalInstance) {
            deleteModalInstance.hide();
        }
    }

    // Delete Action Execution
    async function executeDelete(cid) {
        try {
            // Backend delete API call
            // await fetch(`delete_contact.php?id=${cid}`, { method: 'DELETE' });
            
            // Remove row UI se
            const row = document.getElementById(`contact-row-${cid}`);
            if (row) row.remove();

            closeDeleteModal();
            showToast("Contact deleted successfully!");
        } catch (err) {
            console.error("Delete failed:", err);
        }
    }

    // Toast Alert Notification
    function showToast(message) {
        const toast = document.getElementById('sessionToast');
        document.getElementById('toastMessage').innerText = message;
        toast.classList.remove('d-none');
        setTimeout(() => {
            dismissSessionToast();
        }, 3000);
    }

    function dismissSessionToast() {
        document.getElementById('sessionToast').classList.add('d-none');
    }
</script>

</body>
</html>
