<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Set New Password</h2>

        <form th:action="@{/change-password}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">New Password</label>
                <input type="password" name="newpassword" required placeholder="••••••••"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg transition">
                Update Password
            </button>
        </form>
    </div>

</body>
</html>
