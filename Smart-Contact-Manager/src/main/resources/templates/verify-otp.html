<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">Verify OTP</h2>
        <p class="text-xs text-slate-500 text-center mb-6">We have sent an OTP to your email.</p>

        <form th:action="@{/verify-otp}" method="post" class="space-y-4">
            <div>
                <input type="number" name="otp" required placeholder="Enter 6-digit OTP"
                       class="w-full px-4 py-2 border rounded-lg text-center tracking-widest text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg transition">
                Verify OTP
            </button>
        </form>
    </div>

</body>
</html>
