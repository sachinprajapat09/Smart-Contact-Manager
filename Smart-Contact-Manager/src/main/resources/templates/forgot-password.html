<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Forgot Password</h2>

        <div th:if="${session.message}" class="bg-rose-100 text-rose-700 p-3 rounded-lg text-sm mb-4">
            <span th:text="${session.message}"></span>
        </div>

        <form th:action="@{/send-otp}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Enter Registered Email</label>
                <input type="email" name="email" required placeholder="example@gmail.com"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg transition">
                Send OTP
            </button>
        </form>
    </div>

</body>
</html>
